<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Exotic (jetpacks 9-11, decision 086): two strands winding round the jet (a helix seen from
       the side) over a soft glow, with sparks where they cross. Tiles along X. White on
       transparency, tinted in game. -->
  <defs>
    <filter id="soft" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="across" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="256" height="256" fill="url(#across)"/>
  <g filter="url(#soft)" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round">
    <path d="M0 128 C32 48 96 48 128 128 C160 208 224 208 256 128"/>
    <path d="M0 128 C32 208 96 208 128 128 C160 48 224 48 256 128" opacity="0.75"/>
  </g>
  <g fill="url(#spark)">
    <circle cx="0" cy="128" r="30"/><circle cx="128" cy="128" r="30"/><circle cx="256" cy="128" r="30"/>
  </g>
</svg>
