<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Shock diamonds (jetpacks 6-8, decision 089): bright beads along the jet's core, two to a
       tile, joined by a thin line. Tiles along X. White on transparency, tinted in game. -->
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="across" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <g id="diamond" fill="#fff"><path d="M-46 128 L0 66 L46 128 L0 190 Z"/></g>
  </defs>
  <rect width="256" height="256" fill="url(#across)"/>
  <g filter="url(#soft)">
    <use href="#diamond" x="0"/><use href="#diamond" x="128"/><use href="#diamond" x="256"/>
  </g>
</svg>
