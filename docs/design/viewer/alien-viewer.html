<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пришельцы в 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* One visual world on purpose: the game's deep-space backdrop, like its concept sheets.
   Layout: the model fills the stage; the list of kinds by zone sits beside it (below on a phone). */
:root {
  --space: #0b0e22;
  --panel: #141a3a;
  --line: #2a3263;
  --ink: #eaf0ff;
  --muted: #9ba6cc;
  --accent: #8ff4ff;
  --gold: #ffc23d;
  --display: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--space); color: var(--ink); font-family: var(--display); font-weight: 600; }
.app { height: 100%; display: grid; grid-template-columns: 300px 1fr; }
@media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; } }

.list { overflow-y: auto; padding: 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; background: var(--panel); }
@media (max-width: 760px) { .list { order: 2; border-right: 0; border-top: 1px solid var(--line); } }
.list h1 { font-size: 20px; font-weight: 900; margin: 0; text-wrap: balance; }
.list p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.zone h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.zone ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.kind { width: 100%; text-align: left; font: inherit; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 7px 10px; display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
.kind span { color: var(--muted); font-size: 12px; }
.kind:hover { background: rgba(143, 244, 255, .06); }
.kind[aria-current="true"] { border-color: var(--accent); background: rgba(143, 244, 255, .1); }
.kind:focus-visible, .tier:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage { position: relative; min-height: 360px; background: radial-gradient(ellipse 70% 60% at 50% 40%, #1b2257, var(--space)); }
model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
.hud { position: absolute; left: 16px; right: 16px; top: 14px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px; pointer-events: none; }
.title { pointer-events: none; }
.title b { display: block; font-size: 26px; font-weight: 900; text-wrap: balance; }
.title span { color: var(--muted); font-size: 14px; }
.tiers { display: flex; gap: 6px; pointer-events: auto; }
.tier { font: inherit; font-weight: 800; color: var(--ink); background: rgba(20, 26, 58, .85); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.tier[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.tier.gold[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.help { position: absolute; left: 16px; bottom: 12px; color: var(--muted); font-size: 13px; pointer-events: none; }
</style>
</head>
<body>
<div class="app">
  <nav class="list" aria-label="Пришельцы по зонам">
    <div>
      <h1>Пришельцы в 3D</h1>
      <p>Детёныши стражей, концепт (решение 072). Обводки здесь нет — она рисуется при рендере; цвета и глянец как в игре.</p>
    </div>
    <div id="zones"></div>
  </nav>
  <main class="stage">
    <model-viewer id="viewer" camera-controls auto-rotate auto-rotate-delay="1500" rotation-per-second="20deg"
      shadow-intensity="0.8" exposure="1.05" environment-image="neutral" camera-orbit="-20deg 72deg auto"
      interaction-prompt="none" alt="Пришелец"></model-viewer>
    <div class="hud">
      <div class="title"><b id="name">Слизень-сторож</b><span id="family">Слизень · Пояс обломков</span></div>
      <div class="tiers" role="group" aria-label="Ступень">
        <button class="tier" id="tier-common" type="button" aria-pressed="true">Обычный</button>
        <button class="tier gold" id="tier-legendary" type="button" aria-pressed="false">Легендарный</button>
      </div>
    </div>
    <div class="help">Крути пальцем или мышкой, приближай колёсиком или щипком</div>
  </main>
</div>
<script>
const FAMILY = { slime: "Слизень", crab: "Краб", worm: "Червь", ray: "Скат", swarm: "Рой", whale: "Кит" };
const ZONES = [
  ["Пояс обломков", [
    ["slimeWarden", "Слизень-сторож", "slime"], ["crabDrone", "Краб-дрон", "crab"], ["violetCrab", "Лиловый краб", "crab"],
    ["acidSlime", "Кислотный слизень", "slime"], ["rustyCrab", "Ржавый краб", "crab"], ["slimeKing", "Король слизней", "slime"]]],
  ["Ледяные кольца", [
    ["iceWorm", "Ледяной червь", "worm"], ["snowCrab", "Снежный краб", "crab"], ["frostSlime", "Морозный слизень", "slime"],
    ["crystalWorm", "Хрустальный червь", "worm"], ["iceRay", "Ледяной скат", "ray"], ["wormMother", "Мать червей", "worm"]]],
  ["Красная туманность", [
    ["devourerSwarm", "Рой пожирателей", "swarm"], ["starRay", "Звёздный скат", "ray"], ["fireSlime", "Огненный слизень", "slime"],
    ["redSwarm", "Красный рой", "swarm"], ["lightningRay", "Скат-молния", "ray"], ["devourerQueen", "Матка пожирателей", "swarm"]]],
  ["Горизонт событий", [
    ["shadowWorm", "Теневой червь", "worm"], ["blackRay", "Чёрный скат", "ray"], ["voidSwarm", "Рой пустоты", "swarm"],
    ["gravityCrab", "Гравикраб", "crab"], ["whaleCalf", "Китёнок", "whale"], ["spaceWhale", "Космический Кит", "whale"]]],
];

const viewer = document.getElementById("viewer");
const kinds = {};
let current = "slimeWarden";
let tier = "common";

const zonesEl = document.getElementById("zones");
for (const [zone, list] of ZONES) {
  const section = document.createElement("section");
  section.className = "zone";
  const heading = document.createElement("h2");
  heading.textContent = zone;
  const ul = document.createElement("ul");
  for (const [id, name, family] of list) {
    kinds[id] = { name, family, zone };
    const li = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    button.className = "kind";
    button.id = "kind-" + id;
    button.innerHTML = `${name}<span>${FAMILY[family]}</span>`;
    button.addEventListener("click", () => { location.hash = id; });
    li.appendChild(button);
    ul.appendChild(li);
  }
  section.append(heading, ul);
  zonesEl.appendChild(section);
}

// The host serves no .glb files, so each GLB comes wrapped in a small script as base64
// (models/<id>-<tier>.js sets window.ALIEN_MODELS[name]); it is loaded once, turned into a blob
// and handed to the viewer.
const blobs = {};
function loadModel(name) {
  if (blobs[name]) return Promise.resolve(blobs[name]);
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = `models/${name}.js`;
    script.onload = () => {
      const bytes = Uint8Array.from(atob(window.ALIEN_MODELS[name]), (c) => c.charCodeAt(0));
      delete window.ALIEN_MODELS[name];
      blobs[name] = URL.createObjectURL(new Blob([bytes], { type: "model/gltf-binary" }));
      resolve(blobs[name]);
    };
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

function show() {
  const kind = kinds[current];
  const name = `${current}-${tier}`;
  loadModel(name).then((url) => {
    if (`${current}-${tier}` === name) viewer.src = url;
  });
  viewer.alt = `${kind.name}, ${tier === "common" ? "обычный" : "легендарный"}`;
  document.getElementById("name").textContent = kind.name;
  document.getElementById("family").textContent = `${FAMILY[kind.family]} · ${kind.zone}`;
  for (const button of document.querySelectorAll(".kind")) {
    button.setAttribute("aria-current", String(button.id === "kind-" + current));
  }
  document.getElementById("tier-common").setAttribute("aria-pressed", String(tier === "common"));
  document.getElementById("tier-legendary").setAttribute("aria-pressed", String(tier === "legendary"));
}

function fromHash() {
  const id = location.hash.slice(1);
  current = kinds[id] ? id : "slimeWarden";
  show();
}

document.getElementById("tier-common").addEventListener("click", () => { tier = "common"; show(); });
document.getElementById("tier-legendary").addEventListener("click", () => { tier = "legendary"; show(); });
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) viewer.removeAttribute("auto-rotate");
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
</html>
